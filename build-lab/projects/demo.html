<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Edit the demo KSL Build Lab website project workspace.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#18261f">
  <title>Demo project — KSL Build Lab</title>
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="../../site.webmanifest">
  <link rel="stylesheet" href="../../style.css">
  <script type="module" src="../build-lab.js"></script>
</head>
<body data-build-lab-page="project">
  <header class="site-header"><a class="brand" href="../../index.html"><span class="brand-mark">K</span><span>KSL</span></a><nav class="desktop-nav"><a href="../../build-lab.html">Build Lab</a><a href="../dashboard.html">Dashboard</a><a href="../resources.html">Resources</a></nav><div class="header-actions"><a class="button button-small" href="../stages/discover.html">Open Discover →</a></div></header>
  <main>
    <section class="page-hero"><p class="eyebrow"><span class="status-dot"></span> Project workspace</p><h1 data-project-name>Demo project</h1><p data-project-description>Edit the business details, targets, URLs, build method, and private notes for the local demo project.</p></section>
    <section class="lab-section"><form class="lab-form" id="project-form"><div class="lab-form-grid"><label class="field"><span>Learner name</span><input name="learnerName"></label><label class="field"><span>Project name</span><input name="projectName" required></label><label class="field"><span>Business or niche</span><input name="niche"></label></div><label class="field"><span>Project description</span><textarea name="description" required></textarea></label><div class="lab-form-grid"><label class="field"><span>Target audience</span><input name="audience" required></label><label class="field"><span>Business model</span><select name="businessModel" required><option value="services">Services</option><option value="ecommerce">E-commerce</option><option value="digital-products">Digital products</option><option value="subscriptions">Subscriptions</option><option value="affiliate">Affiliate</option><option value="lead-generation">Lead generation</option></select></label><label class="field"><span>Build method</span><select name="buildMethod"><option value="no-code">No-code</option><option value="cms">CMS</option><option value="custom">Custom development</option><option value="assisted">Assisted KSL build</option></select></label></div><div class="lab-form-grid"><label class="field"><span>Website URL</span><input name="websiteUrl"></label><label class="field"><span>Repository URL</span><input name="repositoryUrl"></label><label class="field"><span>Current stage</span><select name="currentStage"><option value="discover">Discover</option><option value="plan">Plan</option><option value="build">Build</option><option value="launch">Launch</option><option value="rank">Rank</option><option value="market">Market</option><option value="monetize">Monetize</option><option value="operate">Operate</option><option value="scale">Scale</option></select></label></div><div class="lab-form-grid"><label class="field"><span>Traffic target</span><input name="trafficTarget" type="number" min="0"></label><label class="field"><span>Lead target</span><input name="leadTarget" type="number" min="0"></label><label class="field"><span>Revenue target</span><input name="revenueTarget" type="number" min="0"></label></div><label class="field"><span>Private notes</span><textarea name="notes"></textarea></label><button class="button" type="submit">Save project changes →</button><p data-form-message class="muted"></p></form></section>
  </main>
</body>
</html>
